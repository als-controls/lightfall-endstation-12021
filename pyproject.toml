[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lightfall-endstation-12021"
version = "0.1.0"
description = "Lightfall plugins for ALS Beamline 12.0.2.1 endstation"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.11"
authors = [
    { name = "ALS Beamline Controls", email = "controls@als.lbl.gov" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "ophyd>=1.6.0",
    "bluesky>=1.13",
    "event-model>=1.21",  # StreamResource / StreamDatum
    "lightfall",  # plugin base classes
    "numpy>=1.24",
    "h5py>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/als-controls/lightfall-endstation-12021"
Repository = "https://github.com/als-controls/lightfall-endstation-12021"

[project.entry-points."lightfall.plugins"]
lightfall_endstation_12021 = "lightfall_endstation_12021.manifest:manifest"

[tool.hatch.build.targets.wheel]
packages = ["src/lightfall_endstation_12021"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not hw'"
markers = [
    "hw: requires the PI-MTE camera attached via PICam with LightField closed (run with -m hw)",
]
